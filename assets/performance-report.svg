<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Maritime Page Load Performance Report</title>
  <desc id="desc">Preview of the actual dashboard report layout with charts and raw measurements table.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f8ff"/>
      <stop offset="100%" stop-color="#edf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#c8d7e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="40" width="1460" height="1010" rx="22" fill="#ffffff" stroke="#d8e3ea" stroke-width="2"/>
  </g>

  <text x="120" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f2d3a">Maritime Page Load Performance</text>
  <text x="120" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7c85">Generated from Cypress performance runs.</text>

  <g>
    <rect x="120" y="200" width="640" height="250" rx="16" fill="#ffffff" stroke="#d8e3ea" stroke-width="2"/>
    <text x="150" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f2d3a">Total Duration</text>
    <path d="M170 390 C 230 340, 260 350, 320 300 S 420 220, 470 285 S 560 380, 700 240" fill="none" stroke="#087e8b" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#cfeaf4" stroke-width="1">
      <line x1="170" y1="395" x2="700" y2="395"/>
      <line x1="170" y1="330" x2="700" y2="330"/>
      <line x1="170" y1="265" x2="700" y2="265"/>
    </g>
    <g fill="#6b7c85" font-family="Segoe UI, Arial, sans-serif" font-size="12">
      <text x="170" y="420">08:11</text>
      <text x="315" y="420">08:12</text>
      <text x="470" y="420">08:12</text>
      <text x="625" y="420">08:12</text>
    </g>

    <rect x="840" y="200" width="640" height="250" rx="16" fill="#ffffff" stroke="#d8e3ea" stroke-width="2"/>
    <text x="870" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f2d3a">TTFB</text>
    <path d="M870 390 C 930 346, 980 325, 1035 310 S 1125 280, 1180 268 S 1310 250, 1435 280" fill="none" stroke="#f18f01" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#f7e5d7" stroke-width="1">
      <line x1="870" y1="395" x2="1435" y2="395"/>
      <line x1="870" y1="330" x2="1435" y2="330"/>
      <line x1="870" y1="265" x2="1435" y2="265"/>
    </g>

    <rect x="120" y="490" width="640" height="250" rx="16" fill="#ffffff" stroke="#d8e3ea" stroke-width="2"/>
    <text x="150" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f2d3a">First Contentful Paint</text>
    <path d="M170 685 C 235 630, 285 600, 360 560 S 470 520, 540 560 S 620 630, 700 610" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#d9efe8" stroke-width="1">
      <line x1="170" y1="700" x2="700" y2="700"/>
      <line x1="170" y1="620" x2="700" y2="620"/>
      <line x1="170" y1="540" x2="700" y2="540"/>
    </g>

    <rect x="840" y="490" width="640" height="250" rx="16" fill="#ffffff" stroke="#d8e3ea" stroke-width="2"/>
    <text x="870" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f2d3a">DOMContentLoaded</text>
    <path d="M870 685 C 920 650, 995 610, 1050 600 S 1180 580, 1240 560 S 1340 520, 1435 590" fill="none" stroke="#5e60ce" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#e4e6ff" stroke-width="1">
      <line x1="870" y1="700" x2="1435" y2="700"/>
      <line x1="870" y1="620" x2="1435" y2="620"/>
      <line x1="870" y1="540" x2="1435" y2="540"/>
    </g>
  </g>

  <g>
    <rect x="120" y="780" width="1360" height="200" rx="16" fill="#f5fbff" stroke="#d8e3ea" stroke-width="2"/>
    <text x="150" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f2d3a">Average Total Duration by Date</text>
    <g fill="#087e8b">
      <rect x="190" y="860" width="120" height="70" rx="6"/>
      <rect x="355" y="900" width="120" height="30" rx="6"/>
      <rect x="520" y="885" width="120" height="45" rx="6"/>
      <rect x="685" y="875" width="120" height="55" rx="6"/>
      <rect x="850" y="890" width="120" height="40" rx="6"/>
    </g>
    <g fill="#6b7c85" font-family="Segoe UI, Arial, sans-serif" font-size="12">
      <text x="200" y="950">2026-08-05</text>
      <text x="365" y="950">2026-08-06</text>
      <text x="530" y="950">2026-08-07</text>
      <text x="695" y="950">2026-08-08</text>
      <text x="860" y="950">2026-08-09</text>
    </g>

    <g>
      <rect x="1150" y="820" width="280" height="130" rx="12" fill="#ffffff" stroke="#d8e3ea" stroke-width="2"/>
      <text x="1178" y="856" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f2d3a">Raw Measurements</text>
      <line x1="1178" y1="866" x2="1388" y2="866" stroke="#d8e3ea"/>
      <g fill="#6b7c85" font-family="Segoe UI, Arial, sans-serif" font-size="11">
        <text x="1180" y="892">Duration</text>
        <text x="1270" y="892">2119.4</text>
        <text x="1180" y="914">TTFB</text>
        <text x="1270" y="914">371.8</text>
        <text x="1180" y="936">FCP</text>
        <text x="1270" y="936">2136</text>
      </g>
    </g>
  </g>

  <text x="120" y="1035" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7c85">Developed by Petros Plakogiannis</text>
</svg>
